<script>
  // ---- Markdown to HTML ----
  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(text) {
    var codes = [];
    // Code spans first, and kept aside (behind a marker no README would
    // contain), so nothing inside them is taken for a mark.
    text = escapeHtml(text).replace(/`([^`]+)`/g, function (_, code) {
      codes.push("<code>" + code + "</code>");
      return "@@code" + (codes.length - 1) + "@@";
    });
    text = text
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
      .replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, "<strong>$2</strong>")
      .replace(/(\*|_)(?=\S)([^*_]*?\S)\1/g, "<em>$2</em>");
    return text.replace(/@@code(\d+)@@/g, function (_, i) { return codes[Number(i)]; });
  }
  function render(markdown) {
    var lines = markdown.replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var i = 0, m;
    var text = [];
    function paragraph() {
      if (text.length) out.push("<p>" + inline(text.join(" ")) + "</p>");
      text = [];
    }
    // A list item's line as { indent, ordered, text }, or null.
    function listItem(line) {
      var m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(line);
      return m && { indent: m[1].length, ordered: /\d/.test(m[2]), text: m[3] };
    }
    // The list whose items start at `indent`; a deeper item opens a list inside the item above it.
    function list(indent) {
      var ordered = listItem(lines[i]).ordered;
      var items = [], item;
      while (i < lines.length && (item = listItem(lines[i])) && item.indent === indent && item.ordered === ordered) {
        var words = [item.text], nested = "";
        i++;
        while (i < lines.length) {
          var next = listItem(lines[i]);
          if (next && next.indent > indent) nested += list(next.indent);
          // An indented line under an item continues it.
          else if (!next && /\S/.test(lines[i]) && /^\s*/.exec(lines[i])[0].length > indent) words.push(lines[i++].trim());
          else break;
        }
        items.push("<li>" + inline(words.join(" ")) + nested + "</li>");
      }
      return (ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>");
    }
    while (i < lines.length) {
      var line = lines[i];
      if (/^```/.test(line)) {
        paragraph();
        var code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        i++;
        out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
      } else if ((m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line))) {
        paragraph();
        out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">");
        i++;
      } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
        paragraph();
        out.push("<hr>");
        i++;
      } else if (/^>/.test(line)) {
        paragraph();
        var quote = [];
        while (i < lines.length && /^>/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ""));
        out.push("<blockquote>" + render(quote.join("\n")) + "</blockquote>");
      } else if (listItem(line)) {
        paragraph();
        out.push(list(listItem(line).indent));
      } else if (/^\s*<\w+(\s[^>]*)?>/.test(line)) {
        // A raw HTML block, like a row of images: passed through as-is.
        paragraph();
        var html = [];
        while (i < lines.length && !/^\s*$/.test(lines[i])) html.push(lines[i++]);
        out.push(html.join("\n"));
      } else if (/^\s*$/.test(line)) {
        paragraph();
        i++;
      } else {
        text.push(line.trim());
        i++;
      }
    }
    paragraph();
    return out.join("\n");
  }

  fetch("README.md")
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
    .then(function (markdown) {
      document.getElementById("readme").innerHTML = render(markdown);
      var h1 = document.querySelector("#readme h1");
      if (h1) document.title = h1.textContent + ": Chaos Accelerator";
    })
    .catch(function () {
      var box = document.getElementById("readme");
      box.textContent = "The README could not be loaded. ";
      var a = document.createElement("a");
      a.href = "README.md";
      a.textContent = "Open README.md";
      box.appendChild(a);
    });
</script>
