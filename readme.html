<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- The README, as a page: linked as "About" from the landing page's
     corner menu (index.html). This page reads README.md itself and renders
     it, the same way license.html shows the LICENSE file, so there is one
     copy of the text and the repository's front page and this one never
     drift apart. The Markdown is turned into HTML by the small renderer
     below, which covers what a README uses (headings, paragraphs, lists,
     links, images, code, quotes, rules, bold and italic) and nothing
     more: a construct it does not know is shown as the text it was. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>About: Chaos Accelerator</title>
<meta name="description" content="About Chaos Accelerator: the project's README.">
<link rel="stylesheet" href="landing.css?v=m70">
</head>
<body>
<main class="page">
  <a class="back-link" href="index.html">&larr; Chaos Accelerator</a>
  <article class="readme" id="readme"><p class="readme-note">Loading&hellip;</p></article>
  <noscript><p>This page needs JavaScript to show the text. <a href="README.md">Open README.md</a> instead.</p></noscript>
</main>
<script>
  // ---- Markdown to HTML ----
  //
  // Line by line, one block at a time: a fenced code block, a heading, a
  // rule, a quote, a list, or a paragraph (consecutive plain lines). The
  // inline marks (code, images, links, bold, italic) are applied to every
  // block's text except code, in that order, after the text has been
  // escaped, so a README can mention <tags> and they show as written.
  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(text) {
    var codes = [];
    // Code spans first, and kept aside (behind a marker no README would
    // contain), so nothing inside them is taken for a mark.
    text = escapeHtml(text).replace(/`([^`]+)`/g, function (_, code) {
      codes.push("<code>" + code + "</code>");
      return "@@code" + (codes.length - 1) + "@@";
    });
    text = text
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
      .replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, "<strong>$2</strong>")
      .replace(/(\*|_)(?=\S)([^*_]*?\S)\1/g, "<em>$2</em>");
    return text.replace(/@@code(\d+)@@/g, function (_, i) { return codes[Number(i)]; });
  }
  function render(markdown) {
    var lines = markdown.replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var i = 0, m;
    var text = [];
    function paragraph() {
      if (text.length) out.push("<p>" + inline(text.join(" ")) + "</p>");
      text = [];
    }
    while (i < lines.length) {
      var line = lines[i];
      if (/^```/.test(line)) {
        paragraph();
        var code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        i++;
        out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
      } else if ((m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line))) {
        paragraph();
        out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">");
        i++;
      } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
        paragraph();
        out.push("<hr>");
        i++;
      } else if (/^>/.test(line)) {
        paragraph();
        var quote = [];
        while (i < lines.length && /^>/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ""));
        out.push("<blockquote>" + render(quote.join("\n")) + "</blockquote>");
      } else if ((m = /^\s*([-*+]|\d+[.)])\s+/.exec(line))) {
        paragraph();
        var ordered = /\d/.test(m[1]);
        var itemRe = ordered ? /^\s*\d+[.)]\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/;
        var items = [];
        while (i < lines.length && (m = itemRe.exec(lines[i]))) {
          var item = [m[1]];
          i++;
          // An indented line under an item continues it.
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !itemRe.test(lines[i])) item.push(lines[i++].trim());
          items.push("<li>" + inline(item.join(" ")) + "</li>");
        }
        out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
      } else if (/^\s*$/.test(line)) {
        paragraph();
        i++;
      } else {
        text.push(line.trim());
        i++;
      }
    }
    paragraph();
    return out.join("\n");
  }

  fetch("README.md")
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
    .then(function (markdown) {
      document.getElementById("readme").innerHTML = render(markdown);
      var h1 = document.querySelector("#readme h1");
      if (h1) document.title = h1.textContent + ": Chaos Accelerator";
    })
    .catch(function () {
      var box = document.getElementById("readme");
      box.textContent = "The README could not be loaded. ";
      var a = document.createElement("a");
      a.href = "README.md";
      a.textContent = "Open README.md";
      box.appendChild(a);
    });
</script>
</body>
</html>
