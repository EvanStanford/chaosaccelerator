<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- The gallery: patterns people have found, each a pair of screenshots
     (the scene in the builder, and the map it makes) and a link to that
     map. Linked from the landing page (index.html), whose preview strip
     reads the same list, and styled by the same sheet.

     The list is gallery.json in this folder, an array of entries in the
     order they show:

       {
         "scene": "scene1.jpg",           the builder screenshot, in this folder
         "map": "map1.jpg",               the map screenshot, in this folder
         "name": "Double Pendulum",
         "creator": "Evan",
         "url": "../chaos.html#map/..."   where a click on the entry goes
       }

     `url` is the map at the view the screenshot shows. A link pasted straight
     out of a submission email (https://chaosaccelerator.com/chaos.html#map/...)
     works as it is; the entries made here use the relative form, so the
     same file works from a local copy of the site too. To add an entry: put
     the two pictures in this folder as sceneN.jpg and mapN.jpg, and add an
     object to the end of the array. Both pages read the file, nothing else
     has to change. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>Gallery: Chaos Accelerator</title>
<meta name="description" content="Fractals people have made with Chaos Accelerator, and how to add yours.">
<link rel="stylesheet" href="../landing.css?v=m70">
</head>
<body>
<main class="page">

  <a class="back-link" href="../index.html">&larr; Chaos Accelerator</a>

  <header class="masthead">
    <h1>Gallery</h1>
    <p class="tagline">Patterns people have found. Click one to explore its map.</p>
  </header>

  <section class="carousel" id="carousel" aria-roledescription="carousel" aria-label="Gallery">
    <div class="carousel-window">
      <div class="carousel-track" id="carousel-track" tabindex="0" aria-live="polite">
        <p class="carousel-note" id="carousel-note">Loading the gallery&hellip;</p>
      </div>
      <button class="carousel-arrow prev" id="carousel-prev" type="button" aria-label="Previous pattern">&#8249;</button>
      <button class="carousel-arrow next" id="carousel-next" type="button" aria-label="Next pattern">&#8250;</button>
    </div>
    <div class="carousel-dots" id="carousel-dots"></div>
  </section>

  <section class="section submit" aria-labelledby="submit-label">
    <h2 class="section-lead" id="submit-label">Submit your own:</h2>
    <!-- The draft this opens is filled in by the script below, which puts
         the moment of the click in the subject so every submission is its
         own conversation in the inbox. This static address is the same
         draft without that, for a browser that runs no script. -->
    <p>If you find a cool pattern, <a id="submit-link" href="mailto:evan.chaosaccelerator@gmail.com?subject=Gallery%20submission&amp;body=Evan%2C%0D%0AI%20would%20like%20to%20submit%20my%20pattern%20for%20the%20gallery.%0D%0AMap%20screenshot%3A%20%3CPlease%20attach%3E%0D%0AScene%20screenshot%3A%20%3COptionally%20attach%3E%0D%0AUrl%3A%20%3CRequired%20to%20attach%3E">email me (evan.chaosaccelerator@gmail.com)</a> and I will put it in the gallery page.</p>
  </section>

</main>
<script>
  // ---- The carousel ----
  //
  // A scroll container with snapping (see .carousel-track in landing.css),
  // so a swipe, the scroll wheel and a drag of the scrollbar all work with
  // no help from here: the arrows, the dots and the arrow keys only scroll
  // it. Every slide is exactly the track's width, so which one is showing
  // is the scroll position in slide widths.
  (function () {
    var carousel = document.getElementById("carousel");
    var track = document.getElementById("carousel-track");
    var note = document.getElementById("carousel-note");
    var dots = document.getElementById("carousel-dots");
    var prev = document.getElementById("carousel-prev");
    var next = document.getElementById("carousel-next");
    var count = 0;

    function current() {
      return track.clientWidth ? Math.round(track.scrollLeft / track.clientWidth) : 0;
    }
    function goTo(i, instant) {
      i = Math.max(0, Math.min(count - 1, i));
      track.scrollTo({ left: i * track.clientWidth, behavior: instant ? "auto" : "smooth" });
    }
    function update() {
      var i = current();
      prev.disabled = i <= 0;
      next.disabled = i >= count - 1;
      Array.prototype.forEach.call(dots.children, function (dot, j) {
        if (j === i) dot.setAttribute("aria-current", "true");
        else dot.removeAttribute("aria-current");
      });
    }

    function el(tag, className, textContent) {
      var node = document.createElement(tag);
      node.className = className;
      if (textContent !== undefined) node.textContent = textContent;
      return node;
    }
    function picture(src, alt, className) {
      var img = el("img", className);
      img.src = src;
      img.alt = alt;
      img.loading = "lazy";
      return img;
    }
    // One entry of gallery.json (the format is at the head of this file) as
    // a slide. The whole slide is the link. Paths resolve against the list's
    // own address, so a bare file name means this folder and a full address
    // is left alone.
    function slide(entry, base) {
      var a = el("a", "slide");
      a.href = new URL(entry.url, base).href;
      var frame = el("div", "slide-frame");
      frame.appendChild(picture(new URL(entry.map, base).href, entry.name + ": the map", "slide-map"));
      if (entry.scene) frame.appendChild(picture(new URL(entry.scene, base).href, entry.name + ": the scene", "slide-scene"));
      a.appendChild(frame);
      var caption = el("div", "slide-caption");
      caption.appendChild(el("span", "slide-name", entry.name));
      caption.appendChild(el("span", "slide-by", "by " + entry.creator));
      a.appendChild(caption);
      return a;
    }

    prev.addEventListener("click", function () { goTo(current() - 1); });
    next.addEventListener("click", function () { goTo(current() + 1); });
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { e.preventDefault(); goTo(current() - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); goTo(current() + 1); }
    });
    var scrollFrame = null;
    track.addEventListener("scroll", function () {
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(function () { scrollFrame = null; update(); });
    });

    fetch(new URL("gallery.json", location.href))
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function (entries) {
        var base = new URL("gallery.json", location.href);
        note.remove();
        entries.forEach(function (entry, i) {
          track.appendChild(slide(entry, base));
          var dot = document.createElement("button");
          dot.type = "button";
          dot.setAttribute("aria-label", "Pattern " + (i + 1) + " of " + entries.length);
          dot.addEventListener("click", function () { goTo(i); });
          dots.appendChild(dot);
        });
        count = entries.length;
        if (!count) track.appendChild(el("p", "carousel-note", "Nothing here yet. Yours could be the first: see below."));
        carousel.classList.toggle("has-many", count > 1);
        // "#3" opens on the third pattern: what the landing page's strip
        // links to, so the one clicked there is the one that shows.
        var wanted = Number(location.hash.slice(1));
        if (wanted >= 1) goTo(wanted - 1, true);
        update();
      })
      .catch(function () {
        note.textContent = "The gallery couldn't be loaded.";
      });
  })();

  // ---- The submission email ----
  //
  // The link opens a draft, and the draft's subject carries the moment it
  // was opened, to the second: mail clients thread messages by subject, and
  // a dozen submissions all titled "Gallery submission" would land in the
  // inbox as one conversation. Set now, so the address is right when it is
  // copied or previewed, and again on the click, so it is the click's own
  // time and not the page's.
  (function () {
    var link = document.getElementById("submit-link");
    var ADDRESS = "evan.chaosaccelerator@gmail.com";
    var BODY = [
      "Evan,",
      "I would like to submit my pattern for the gallery.",
      "Map screenshot: <Please attach>",
      "Scene screenshot: <Optionally attach>",
      "Url: <Required to attach>",
    ].join("\r\n");
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function stamp() {
      var d = new Date();
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
        " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }
    function refresh() {
      link.href = "mailto:" + ADDRESS +
        "?subject=" + encodeURIComponent("Gallery submission " + stamp()) +
        "&body=" + encodeURIComponent(BODY);
    }
    refresh();
    link.addEventListener("click", refresh);
  })();
</script>
</body>
</html>
