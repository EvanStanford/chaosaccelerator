<script>
  // ---- The carousel ----
  (function () {
    var track = document.getElementById("carousel-track");
    var dots = document.getElementById("carousel-dots");
    var prev = document.getElementById("carousel-prev");
    var next = document.getElementById("carousel-next");
    var slides = Array.prototype.slice.call(track.querySelectorAll(".slide"));
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function current() {
      var mid = track.scrollLeft + track.clientWidth / 2;
      var best = 0, bestDist = Infinity;
      slides.forEach(function (s, i) {
        var d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - mid);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      return best;
    }
    function goTo(i) {
      var s = slides[Math.max(0, Math.min(slides.length - 1, i))];
      track.scrollTo({ left: s.offsetLeft - (track.clientWidth - s.offsetWidth) / 2, behavior: reduced ? "auto" : "smooth" });
    }
    function update() {
      var i = current();
      prev.disabled = i <= 0;
      next.disabled = i >= slides.length - 1;
      Array.prototype.forEach.call(dots.children, function (dot, j) {
        if (j === i) dot.setAttribute("aria-current", "true");
        else dot.removeAttribute("aria-current");
      });
      slides.forEach(function (s, j) { s.classList.toggle("is-current", j === i); });
    }

    slides.forEach(function (s, i) {
      s.addEventListener("click", function (e) {
        if (i !== current()) { e.preventDefault(); goTo(i); }
      });
      var dot = document.createElement("button");
      dot.type = "button";
      dot.setAttribute("aria-label", "Project " + (i + 1) + " of " + slides.length);
      dot.addEventListener("click", function () { goTo(i); });
      dots.appendChild(dot);
    });
    prev.addEventListener("click", function () { goTo(current() - 1); });
    next.addEventListener("click", function () { goTo(current() + 1); });
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { e.preventDefault(); goTo(current() - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); goTo(current() + 1); }
    });
    var scrollFrame = null;
    track.addEventListener("scroll", function () {
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(function () { scrollFrame = null; update(); });
    });
    update();
  })();

  // ---- The menu's X, the '80s switch and the grid behind the page ----
  EightiesTheme.start({
    canvas: document.getElementById("ride"),
    horizon: 0.25,
    speed: 0,
    dim: 0.35,
    // Slides with the carousel, a project at a time.
    lane: function () {
      var track = document.getElementById("carousel-track");
      var slides = track.querySelectorAll(".slide");
      var stride = slides.length > 1 ? slides[1].offsetLeft - slides[0].offsetLeft : 0;
      return stride ? track.scrollLeft / stride : 0;
    },
  });
</script>
