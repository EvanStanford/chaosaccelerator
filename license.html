<!-- The license, as a page. The LICENSE file has no extension, so a web
     server has nothing to tell a browser about what it is and serves it as
     "application/octet-stream", which a browser downloads rather than
     shows. A link cannot change that (the type is the server's to say), so
     this page reads the very same file and displays it: one copy of the
     text, and it opens on any host, however that host labels the file. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>License: Chaos Accelerator</title>
<link rel="stylesheet" href="landing.css?v=m70">
</head>
<body>
<main class="page">
  <a class="back-link" href="index.html">&larr; Chaos Accelerator</a>
  <pre class="license-text" id="license-text">Loading the license&hellip;</pre>
  <noscript><p>This page needs JavaScript to show the text. <a href="LICENSE">Download the LICENSE file</a> instead.</p></noscript>
</main>
<script>
  fetch("LICENSE")
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
    .then(function (text) { document.getElementById("license-text").textContent = text; })
    .catch(function () {
      var pre = document.getElementById("license-text");
      pre.textContent = "The license text could not be loaded. ";
      var a = document.createElement("a");
      a.href = "LICENSE";
      a.textContent = "Download the LICENSE file";
      pre.appendChild(a);
    });
</script>
</body>
</html>
