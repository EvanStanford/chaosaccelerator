<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- CPAL-1.0 License. See chaosaccelerator.com/license.html -->
<!-- Shows the LICENSE file: having no extension, a server sends it as a download, so this page fetches and displays it. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>License: Chaos Accelerator</title>
<script>
  // Before first paint, so a page with the '80s switched off never flashes them.
  try { if (localStorage.getItem("eightiesOff") === "1") document.documentElement.classList.add("eighties-off"); } catch (e) {}
</script>
<link rel="stylesheet" href="scripts/landing.css?v=m80">
<link rel="stylesheet" href="scripts/eighties.css?v=m80">
<link rel="preload" href="assets/fonts/saira-latin.woff2?v=m80" as="font" type="font/woff2" crossorigin>
</head>
<body class="eighties">
<canvas class="ride" id="ride" aria-hidden="true"></canvas>
<script src="scripts/corner-menu.js?v=m80"></script>
<main class="page">
  <a class="back-link" href="index.html">&larr; Chaos Accelerator</a>
  <pre class="license-text" id="license-text">Loading the license&hellip;</pre>
  <noscript><p>This page needs JavaScript to show the text. <a href="LICENSE">Download the LICENSE file</a> instead.</p></noscript>
</main>
<div class="watermark">chaosaccelerator.com</div>
<script>
  fetch("LICENSE")
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
    .then(function (text) { document.getElementById("license-text").textContent = text; })
    .catch(function () {
      var pre = document.getElementById("license-text");
      pre.textContent = "The license text could not be loaded. ";
      var a = document.createElement("a");
      a.href = "LICENSE";
      a.textContent = "Download the LICENSE file";
      pre.appendChild(a);
    });
</script>
<script src="scripts/eighties-ride.js?v=m80"></script>
<script src="scripts/eighties-theme.js?v=m80"></script>
<script>
  // ---- The menu's X, the '80s switch and the grid behind the page ----
  EightiesTheme.start({
    canvas: document.getElementById("ride"),
    horizon: 0.25,
    speed: 0,
    dim: 0.35,
  });
</script>
</body>
</html>
